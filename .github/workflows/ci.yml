name: ci

# Every push and pull request runs all checks, each as its own job.
on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Host unit tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run tests (with AddressSanitizer + UBSan)
        run: make -C tests SAN=1

  ring-buffer-threads:
    name: Ring buffer, 2 threads (ThreadSanitizer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TSan needs a fixed memory layout; recent kernels randomise addresses
      # with more bits than it supports ("unexpected memory mapping").
      - name: Reduce address randomisation for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Producer + consumer threads, 2 million frames
        run: make -C tests tsan

  tools-syntax:
    name: Tools syntax (Python + shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tools run on the BBB / in WSL, never on this PC build, so a typo
      # would only show up on the bench. Compile-check every script instead.
      - name: Python scripts compile
        run: find tools -name '*.py' -print -exec python3 -m py_compile {} +

      - name: Shell scripts parse
        # xargs (not find -exec ... \;) so one bad script fails the job.
        run: find tools -name '*.sh' -print0 | xargs -0 -n1 -t sh -n

  firmware-build:
    name: Firmware build (arm-none-eabi, -Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version

      - name: Build the firmware
        run: make -f firmware.mk -j"$(nproc)"

      - name: Keep the .elf and .map as a download
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/fw/STM32-SmartNIC.elf
            build/fw/STM32-SmartNIC.map
